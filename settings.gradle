plugins {
    // Apply the foojay-resolver plugin to allow automatic download of JDKs
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'gradle-app'
include('app', 'list', 'utilities')

apply plugin : 'jacoco'

test {
  reports.html.setDestination(file("$projectDir/testReport"));

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }

  jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation =  file("$projectDir/coverageReport")
    }
  }
}


dependencies {
//dependency added by roostGPT
testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.0")
testImplementation("org.junit.jupiter:junit-jupiter-engine:5.10.0")
testImplementation("org.mockito:mockito-core:5.5.0")
testImplementation("org.mockito:mockito-junit-jupiter:5.5.0")
testImplementation("org.springframework:spring-context:6.0.11")
testImplementation("org.springframework:spring-tx:6.0.11")
testImplementation("org.springframework:spring-core:6.0.11")
testImplementation("org.springframework:spring-beans:6.0.11")
testImplementation("org.springframework:spring-aop:6.0.11")
testImplementation("org.springframework:spring-expression:6.0.11")
testImplementation("org.springframework:spring-jcl:6.0.11")
testImplementation("net.bytebuddy:byte-buddy:1.14.5")
testImplementation("net.bytebuddy:byte-buddy-agent:1.14.5")
testImplementation("org.objenesis:objenesis:3.3")
testImplementation("org.opentest4j:opentest4j:1.2.0")
testImplementation("org.junit.platform:junit-platform-commons:1.10.0")
testImplementation("org.junit.platform:junit-platform-engine:1.10.0")
testImplementation("org.apiguardian:apiguardian-api:1.1.2")
}