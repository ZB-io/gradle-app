
apply plugin: 'java'
apply plugin: 'jacoco'

repositories {
    mavenCentral()
}

allprojects {
    apply plugin: 'jacoco'
}

subprojects {
    afterEvaluate {
        if (tasks.findByName('test')) {
            test {
                reports.html.setDestination(file("$projectDir/testReport"))
                jacoco {
                    enabled = true
                    includeNoLocationClasses = false
                    sessionId = "<auto-generated value>"
                    dumpOnExit = true
                    classDumpDir = null
                    output = JacocoTaskExtension.Output.FILE
                }
            }

            jacocoTestReport {
                reports {
                    xml.required = false
                    csv.required = false
                    html.outputLocation = file("$projectDir/coverageReport")
                }
            }
        }
    }
}
