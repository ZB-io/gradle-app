/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-library-conventions'
}

dependencies {
    api project(':list')

//dependency added by roostGPT
testImplementation 'org.mockito:mockito-core:5.11.0'
testImplementation 'org.mockito:mockito-inline:5.11.0'
testImplementation 'net.bytebuddy:byte-buddy:1.14.12'
testImplementation 'net.bytebuddy:byte-buddy-agent:1.14.12'
testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

//dependency added by roostGPT
testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
}

apply plugin : 'java'
apply plugin : 'jacoco'

repositories {
    mavenCentral()
}

test {
  reports.html.outputLocation = file("$projectDir/testReport");

  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
  }
    
  jacoco {
    enabled = true
    includeNoLocationClasses = false
    sessionId = "<auto-generated value>"
    dumpOnExit = true
    classDumpDir = null
    output = JacocoTaskExtension.Output.FILE
  }

  jacocoTestReport {
    reports {
        xml.required = false
        csv.required = false
        html.outputLocation =  file("$projectDir/coverageReport")
    }
  }
}
